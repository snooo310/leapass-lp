<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeaPASS YouTube案内</title>
<meta name="description" content="れお(LeaPASS)のYouTubeチャンネルで配信中の、やり直し英語×英会話の動画を紹介するページ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;600;700&family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cloud:#f3f9fc; --sky-pale:#e4f1f8; --surface:#ffffff;
    --text:#33403e; --text-muted:#6b8180; --heading:#2d4f4d;
    --sage:#5f8f8c; --sage-deep:#4a90c2; --sage-deep2:#2f6d9e; --panel-a:#d8ebf2; --panel-b:#b8dbe9;
    --panel-a:#d8ebf2; --panel-b:#b8dbe9;
    --sky:#bfe0f5; --blush:#f5cdd2;
    --gold:#e0808f; --gold-deep:#c25f70; --gold-ink:#4a2420;
    --line:#d7e6ea;
    --shadow: 0 24px 50px -24px rgba(47,109,158,0.3);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --cloud:#0f1a1c; --sky-pale:#132025; --surface:#17262a;
      --text:#e6f0ee; --text-muted:#9db3b1; --heading:#eef7f5; --sage:#7fb3b0; --line:#243a3d;
      --shadow: 0 24px 50px -24px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --cloud:#0f1a1c; --sky-pale:#132025; --surface:#17262a;
    --text:#e6f0ee; --text-muted:#9db3b1; --heading:#eef7f5; --sage:#7fb3b0; --line:#243a3d;
    --shadow: 0 24px 50px -24px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cloud);color:var(--text);font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;line-height:1.8;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  h1,h2{font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;color:var(--heading);text-wrap:balance;margin:0;font-weight:800;}
  .wrap{max-width:740px;margin:0 auto;padding:0 24px;}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:0.76rem;font-weight:700;letter-spacing:0.06em;color:var(--gold-deep);background:rgba(238,143,174,0.14);padding:7px 16px;border-radius:999px;}
  .eyebrow::before{content:"✦";font-size:0.8em;}
  .eyebrow.on-dark{color:var(--gold-deep);background:rgba(255,255,255,0.55);}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:17px 32px;border-radius:16px;font-weight:700;font-size:0.98rem;font-family:"Zen Kaku Gothic New",sans-serif;text-decoration:none;border:none;cursor:pointer;transition:transform .15s ease;}
  .btn:hover{transform:translateY(-2px);}
  .btn-gold{background:var(--gold);color:var(--gold-ink);box-shadow:var(--shadow);}
  @keyframes ctaPulse{0%,100%{box-shadow:var(--shadow), 0 0 0 0 rgba(238,143,174,0.35);}50%{box-shadow:var(--shadow), 0 0 0 10px rgba(238,143,174,0);}}
  .btn-gold{animation:ctaPulse 2.6s ease-in-out infinite;}
  @media (prefers-reduced-motion: reduce){ .btn-gold{animation:none;} }

  header.site{padding:22px 0;}
  .logo{display:flex;align-items:center;gap:8px;justify-content:center;font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:1.25rem;color:var(--sage-deep);text-decoration:none;}
  .logo span{color:var(--gold-deep);}
  .logo-mark{height:28px;width:auto;display:block;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.15);}


  .hero{
    position:relative;color:var(--heading);text-align:center;
    background:
      radial-gradient(600px 340px at 50% -14%, rgba(238,143,174,0.18), transparent 62%),
      radial-gradient(460px 320px at 6% 6%, rgba(247,201,214,0.16), transparent 58%),
      radial-gradient(400px 280px at 90% 100%, rgba(191,224,245,0.12), transparent 55%),
      linear-gradient(155deg, var(--panel-a) 0%, var(--panel-b) 70%, #a3cfe0 100%);
    border-radius:22px;padding:52px 28px 44px;overflow:hidden;
  }
  .play-badge{width:64px;height:64px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:1.4rem;position:relative;}
  .hero h1{color:var(--heading);font-size:clamp(1.6rem,3.6vw,2.1rem);margin:8px 0 16px;position:relative;}
  .hero p{color:var(--text-muted);max-width:44ch;margin:0 auto;font-size:0.96rem;position:relative;}
  .channel-meta{display:flex;justify-content:center;gap:0;margin-top:26px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,0.18);padding-top:22px;position:relative;}
  .channel-meta .m{padding:0 24px;border-right:1px solid rgba(255,255,255,0.18);}
  .channel-meta .m:last-child{border-right:none;}
  .channel-meta .num{font-family:"Zen Kaku Gothic New";font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;}
  .channel-meta .label{font-size:0.76rem;color:var(--text-muted);margin-top:2px;}

  section{padding:52px 0;}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--line);border-radius:16px;overflow:hidden;}
  @media (max-width:700px){ .cards{grid-template-columns:1fr;} }
  .video-embed{margin-top:20px;border-radius:24px;overflow:hidden;box-shadow:var(--shadow);background:var(--sage-deep2);}
  .video-embed .frame-wrap{position:relative;width:100%;padding-top:56.25%;}
  .video-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .card{background:var(--surface);padding:26px 24px;text-decoration:none;display:block;transition:background .2s ease, transform .2s ease;position:relative;}
  .card:hover{background:var(--sky-pale);transform:translateY(-3px);}
  .play-badge{transition:transform .3s cubic-bezier(.3,.8,.3,1.2);}
  .hero:hover .play-badge{transform:scale(1.08) rotate(8deg);}
  .card .tag{display:inline-block;font-size:0.7rem;font-weight:700;letter-spacing:0.06em;color:var(--gold-ink);background:var(--gold);padding:4px 11px;border-radius:999px;margin-bottom:14px;}
  .card h3{font-size:1.02rem;margin:0 0 8px;color:var(--heading);font-family:"Zen Kaku Gothic New";}
  .card p{font-size:0.86rem;color:var(--text-muted);margin:0;}

  .cta-panel{
    text-align:center;background:linear-gradient(155deg, var(--panel-a) 0%, var(--panel-b) 100%);color:var(--heading);
    border-radius:24px;padding:48px 26px;margin-top:12px;position:relative;overflow:hidden;
  }
  .cta-panel::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 260px at 50% 0%, rgba(255,255,255,0.14), transparent 65%);}
  .cta-panel .btn, .cta-panel p{position:relative;}
  .cta-panel h2{color:var(--heading);font-size:clamp(1.3rem,2.6vw,1.7rem);margin-bottom:12px;position:relative;}
  .cta-panel p{color:var(--text-muted);max-width:40ch;margin:0 auto 26px;font-size:0.92rem;position:relative;}

  footer{padding:40px 0;text-align:center;}
  .foot-tag{font-family:"Shippori Mincho",serif;color:var(--text-muted);font-size:0.9rem;margin-bottom:14px;}
  .foot-links{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:0.85rem;margin-bottom:14px;}
  .foot-links a{text-decoration:none;color:var(--text-muted);}
  .foot-links a:hover{color:var(--gold-deep);}
  .copyright{font-size:0.75rem;color:var(--text-muted);}
</style>
</head>
